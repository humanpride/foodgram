openapi: 3.0.2
info:
  title: 'Foodgram'
  version: ''
paths:
  /api/users/:
    get:
      operationId: List users
      description: ''
      parameters:
        - name: page
          required: false
          in: query
          description: Page number.
          schema:
            type: integer
        - name: limit
          required: false
          in: query
          description: Number of items per page.
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 123
                    description: 'Total number of objects in the database'
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://foodgram.example.org/api/users/?page=4
                    description: 'Link to the next page'
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://foodgram.example.org/api/users/?page=2
                    description: 'Link to the previous page'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                    description: 'List of objects on the current page'
          description: ''
      tags:
        - Users
    post:
      operationId: Register a user
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUserCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserResponseOnCreate'
          description: 'User created successfully'
        '400':
          $ref: '#/components/responses/ValidationError'
      tags:
        - Users
  /api/tags/:
    get:
      operationId: List tags
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
      tags:
        - Tags
  /api/tags/{id}/:
    get:
      operationId: Retrieve a tag
      description: ''
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this tag."
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Tags
  /api/recipes/:
    get:
      operationId: List recipes
      description: This page is available to all users. Recipes can be filtered by favorites, author, shopping list, and tags.
      parameters:
        - name: page
          required: false
          in: query
          description: Page number.
          schema:
            type: integer
        - name: limit
          required: false
          in: query
          description: Number of items per page.
          schema:
            type: integer
        - name: is_favorited
          required: false
          in: query
          description: Show only recipes in favorites.
          schema:
            type: integer
            enum: [0, 1]
        - name: is_in_shopping_cart
          required: false
          in: query
          description: Show only recipes in the shopping list.
          schema:
            type: integer
            enum: [0, 1]
        - name: author
          required: false
          in: query
          description: Show only recipes by the author with the specified ID.
          schema:
            type: integer
        - name: tags
          required: false
          in: query
          description: Show only recipes with the specified tags (by slug)
          example: 'lunch&tags=breakfast'

          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 123
                    description: 'Total number of objects in the database'
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://foodgram.example.org/api/recipes/?page=4
                    description: 'Link to the next page'
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://foodgram.example.org/api/recipes/?page=2
                    description: 'Link to the previous page'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeList'
                    description: 'List of objects on the current page'
          description: ''
      tags:
        - Recipes
    post:
      security:
        - Token: []
      operationId: Create a recipe
      description: 'Available only to authenticated users'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
          description: 'Recipe created successfully'
        '400':
          description: 'Validation errors in the standard DRF format'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/schemas/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Recipes
  /api/recipes/download_shopping_cart/:
    get:
      security:
        - Token: [ ]
      operationId: Download the shopping list
      description: 'Download a file containing the shopping list. Supported formats include TXT/PDF/CSV. The file contents must meet the assignment requirements. Available only to authenticated users.'
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
        - Shopping list
  /api/recipes/{id}/:
    get:
      operationId: Retrieve a recipe
      description: ''
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this recipe"
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
          description: ''
      tags:
        - Recipes
    patch:
      operationId: Update a recipe
      security:
        - Token: [ ]
      description: 'Available only to the author of this recipe'
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this recipe."
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
          description: 'Recipe updated successfully'
        '400':
          $ref: '#/components/responses/NestedValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Recipes
    delete:
      operationId: Delete a recipe

      description: 'Available only to the author of this recipe'
      security:
        - Token: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this recipe"
          schema:
            type: string
      responses:
        '204':
          description: 'Recipe deleted successfully'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Recipes
  /api/recipes/{id}/get-link/:
    get:
      operationId: Get a short link to a recipe
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of the recipe."
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeGetShortLink'
          description: 'Link to the recipe'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Recipes
  /api/recipes/{id}/favorite/:
    post:
      operationId: Add a recipe to favorites
      description: 'Available only to authenticated users.'
      security:
        - Token: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this recipe"
          schema:
            type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeMinified'
          description: 'Recipe added to favorites successfully'
        '400':
          description: 'Failed to add the recipe to favorites (for example, if it is already in favorites)'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/RecipeNotFound'

      tags:
        - Favorites
    delete:
      operationId: Remove a recipe from favorites
      description: 'Available only to authenticated users'
      security:
        - Token: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this recipe."
          schema:
            type: string
      responses:
        '204':
          description: 'Recipe removed from favorites successfully'
        '400':
          description: 'Failed to remove the recipe from favorites (for example, if it was not in favorites)'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/RecipeNotFound'
      tags:
        - Favorites
  /api/recipes/{id}/shopping_cart/:
    post:
      operationId: Add a recipe to the shopping list
      description: 'Available only to authenticated users'
      security:
        - Token: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this recipe."
          schema:
            type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeMinified'
          description: 'Recipe added to the shopping list successfully'
        '400':
          description: 'Failed to add the recipe to the shopping list (for example, if it is already in the shopping list)'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/RecipeNotFound'
      tags:
        - Shopping list
    delete:
      operationId: Remove a recipe from the shopping list
      description: 'Available only to authenticated users'
      security:
        - Token: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this recipe."
          schema:
            type: string
      responses:
        '204':
          description: 'Recipe removed from the shopping list successfully'
        '400':
          description: 'Failed to remove the recipe from the shopping list (for example, if it was not in the shopping list)'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/RecipeNotFound'
      tags:
        - Shopping list
  /api/users/{id}/:
    get:
      operationId: User profile
      description: 'Available to all users.'
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique ID of this user"
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Users
  /api/users/me/:
    get:
      operationId: Current user
      description: ''
      parameters: []
      security:
        - Token: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
        - Users
  /api/users/me/avatar/:
    put:
      operationId: Add an avatar
      description: Add an avatar for the current user
      parameters: []
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvatar'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetAvatarResponse'
          description: 'Avatar added successfully'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
        - Users
    delete:
      operationId: Delete the avatar
      description: Delete the current user's avatar
      parameters: []
      security:
        - Token: []
      responses:
        '204':
          description: Avatar deleted successfully
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
        - Users
  /api/users/subscriptions/:
    get:
      operationId: Following
      description: 'Return the users followed by the current user. Their recipes are included in the response.'
      security:
        - Token: []
      parameters:
        - name: page
          required: false
          in: query
          description: Page number.
          schema:
            type: integer
        - name: limit
          required: false
          in: query
          description: Number of items per page.
          schema:
            type: integer
        - name: recipes_limit
          required: false
          in: query
          description: Number of objects in the recipes field.
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 123
                    description: 'Total number of objects in the database'
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://foodgram.example.org/api/users/subscriptions/?page=4
                    description: 'Link to the next page'
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://foodgram.example.org/api/users/subscriptions/?page=2
                    description: 'Link to the previous page'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWithRecipes'
                    description: 'List of objects on the current page'
          description: ''
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
        - Subscriptions
  /api/users/{id}/subscribe/:
    post:
      operationId: Follow a user
      description: 'Available only to authenticated users'
      security:
        - Token: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this user."
          schema:
            type: string
        - name: recipes_limit
          required: false
          in: query
          description: Number of objects in the recipes field.
          schema:
            type: integer
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithRecipes'
          description: 'Subscription created successfully'
        '400':
          description: 'Failed to follow the user (for example, if already following them or trying to follow yourself)'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/UserNotFound'
      tags:
        - Subscriptions
    delete:
      operationId: Unfollow a user
      description: 'Available only to authenticated users'
      security:
        - Token: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of this user."
          schema:
            type: string
      responses:
        '204':
          description: 'Successfully unfollowed the user'
        '400':
          description: 'Failed to unfollow the user (for example, if not following them)'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/UserNotFound'

      tags:
        - Subscriptions
  /api/ingredients/:
    get:
      operationId: List of ingredients
      description: 'List of ingredients, searchable by name.'
      parameters:
        - name: name
          required: false
          in: query
          description: Search for ingredients whose names start with the specified text.
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
          description: ''
      tags:
        - Ingredients
  /api/ingredients/{id}/:
    get:
      operationId: Retrieve an ingredient
      description: 'Unique identifier of this ingredient.'
      parameters:
        - name: id
          in: path
          required: true
          description: ''
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
          description: ''
      tags:
        - Ingredients
  /api/users/set_password/:
    post:
      operationId: Change password
      description: 'Change the current user''s password'
      parameters: []
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
      responses:
        '204':
          description: 'Password changed successfully'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
        - Users
  /api/auth/token/login/:
    post:
      operationId: Obtain an authentication token
      description: Authenticate with an email address and password to obtain a token for subsequent requests.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenGetResponse'
          description: ''
      tags:
        - Users
  /api/auth/token/logout/:
    post:
      operationId: Delete the token
      description: Delete the current user's token
      parameters: []
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema: {}

      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: ''
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
        - Users
components:
  schemas:
    User:
      description:  'User (the recipe author when included in a recipe)'
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: "Email address"
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: "Unique username"
          pattern: ^[\w.@+-]+\z
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
          description: "First name"
          example: "Vasya"
        last_name:
          type: string
          maxLength: 150
          description: "Last name"
          example: "Ivanov"
        is_subscribed:
          type: boolean
          readOnly: true
          description: "Whether the current user follows this user"
          example: false
        avatar:
          type: string
          format: uri
          description: 'Avatar URL'
          example: 'http://foodgram.example.org/media/users/image.png'
      required:
        - username
    UserWithRecipes:
      description: 'Extended user object with recipes'
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: "Email address"
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: "Unique username"
          pattern: ^[\w.@+-]+\z
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
          description: "First name"
          example: "Vasya"
        last_name:
          type: string
          maxLength: 150
          description: "Last name"
          example: "Ivanov"
        is_subscribed:
          type: boolean
          readOnly: true
          description: "Whether the current user follows this user"
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeMinified'
        recipes_count:
          type: integer
          description: 'Total number of recipes by the user'
        avatar:
          type: string
          format: uri
          description: 'Avatar URL'
          example: 'http://foodgram.example.org/media/users/image.png'
    SetAvatar:
      description: 'Add a user avatar'
      type: object
      properties:
        avatar:
          description: 'Base64-encoded image'
          example: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAgMAAABieywaAAAACVBMVEUAAAD///9fX1/S0ecCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAACklEQVQImWNoAAAAggCByxOyYQAAAABJRU5ErkJggg=='
          type: string
          format: binary
      required:
        - avatar
    SetAvatarResponse:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          description: 'Avatar URL'
          example: 'http://foodgram.example.org/media/users/image.png'

    Tag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 32
          description: 'Unique name'
          example: 'Breakfast'
        slug:
          type: string
          nullable: true
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
          description: 'Unique slug'
          example: 'breakfast'
    RecipeList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: 'Unique ID'
        tags:
          description: 'List of tags'
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        author:
          readOnly: true
          $ref: '#/components/schemas/User'
        ingredients:
          readOnly: true
          description: 'List of ingredients'
          type: array
          items:
            $ref: '#/components/schemas/IngredientInRecipe'
        is_favorited:
          readOnly: true
          type: boolean
          description: 'Whether the recipe is in favorites'
        is_in_shopping_cart:
          readOnly: true
          type: boolean
          description: 'Whether the recipe is in the shopping cart'
        name:
          readOnly: true
          type: string
          maxLength: 256
          description: 'Name'
        image:
          readOnly: true
          description: 'URL of the image on the site'
          example: 'http://foodgram.example.org/media/recipes/images/image.png'
          type: string
          format: uri
        text:
          readOnly: true
          description: 'Description'
          type: string
        cooking_time:
          readOnly: true
          description: 'Cooking time (in minutes)'
          type: integer
          minimum: 1
    RecipeMinified:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: 'Unique ID'
        name:
          type: string
          maxLength: 256
          description: 'Name'
        image:
          description: 'URL of the image on the site'
          example: 'http://foodgram.example.org/media/recipes/images/image.png'
          type: string
          format: uri
        cooking_time:
          description: 'Cooking time (in minutes)'
          type: integer
          minimum: 1
    RecipeGetShortLink:
      type: object
      properties:
        short-link:
          type: string
          description: 'Short link'
          format: uri
          example: 'https://foodgram.example.org/s/3d0'
    Ingredient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
          example: 'Cabbage'
        measurement_unit:
          type: string
          maxLength: 64
          example: 'kg'
      required:
        - name
        - measurement_unit
    IngredientInRecipe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
          description: 'Name'
          example: 'Boiled potatoes'
        measurement_unit:
          type: string
          maxLength: 64
          description: 'Units of measurement'
          example: 'g'
        amount:
          type: integer
          description: 'Amount'
          minimum: 1

      required:
        - name
        - measurement_unit
    CustomUserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: "Email address"
          example: "vpupkin@yandex.ru"
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: "Unique username"
          pattern: ^[\w.@+-]+\z
          maxLength: 150
          example: "vasya.pupkin"
        first_name:
          type: string
          maxLength: 150
          description: "First name"
          example: "Vasya"
        last_name:
          type: string
          maxLength: 150
          description: "Last name"
          example: "Ivanov"
        password:
          type: string
          description: "Password"
          example: "Qwerty123"
      required:
        - username
        - password
        - first_name
        - last_name
        - email
    CustomUserResponseOnCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: "Email address"
          example: "vpupkin@yandex.ru"
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: "Unique username"
          pattern: ^[\w.@+-]+\z
          maxLength: 150
          example: "vasya.pupkin"
        first_name:
          type: string
          maxLength: 150
          description: "First name"
          example: "Vasya"
        last_name:
          type: string
          maxLength: 150
          description: "Last name"
          example: "Ivanov"
      required:
        - username
        - first_name
        - last_name
        - email
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
        - uid
        - token
    SendEmailReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
      required:
        - uid
        - token
        - new_password
    UsernameResetConfirm:
      type: object
      properties:
        new_email:
          type: string
          format: email
          maxLength: 254
    SetPassword:
      type: object
      properties:
        new_password:
          type: string
        current_password:
          type: string
      required:
        - new_password
        - current_password
    SetUsername:
      type: object
      properties:
        current_password:
          type: string
        new_email:
          type: string
          format: email
          maxLength: 254
      required:
        - current_password
    TokenCreate:
      type: object
      properties:
        password:
          type: string
        email:
          type: string
      required:
        - password
        - email
    TokenGetResponse:
      type: object
      properties:
        auth_token:
          type: string
    RecipeCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ingredients:
          description: List of ingredients
          type: array
          items:
            example:
              id: 1123
              amount: 10
            type: object
            properties:
              id:
                description: 'Unique ID'
                type: integer
              amount:
                description: 'Amount in the recipe'
                type: integer
            required:
              - id
              - amount
        tags:
          description: 'List of tag IDs'
          type: array
          example: [1, 2]
          items:
            type: integer
        image:
          description: 'Base64-encoded image'
          example: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAgMAAABieywaAAAACVBMVEUAAAD///9fX1/S0ecCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAACklEQVQImWNoAAAAggCByxOyYQAAAABJRU5ErkJggg=='
          type: string
          format: binary
        name:
          description: 'Name'
          type: string
          maxLength: 256
        text:
          description: 'Description'
          type: string
        cooking_time:
          description: 'Cooking time (in minutes)'
          type: integer
          minimum: 1
      required:
        - ingredients
        - tags
        - image
        - name
        - text
        - cooking_time
    RecipeUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ingredients:
          description: List of ingredients
          type: array
          items:
            example:
              id: 1123
              amount: 10
            type: object
            properties:
              id:
                description: 'Unique ID'
                type: integer
              amount:
                description: 'Amount in the recipe'
                type: integer
            required:
              - id
              - amount
        tags:
          description: 'List of tag IDs'
          type: array
          example: [1, 2]
          items:
            type: integer
        image:
          description: 'Base64-encoded image'
          example: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAgMAAABieywaAAAACVBMVEUAAAD///9fX1/S0ecCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAACklEQVQImWNoAAAAggCByxOyYQAAAABJRU5ErkJggg=='
          type: string
          format: binary
        name:
          description: 'Name'
          type: string
          maxLength: 256
        text:
          description: 'Description'
          type: string
        cooking_time:
          description: 'Cooking time (in minutes)'
          type: integer
          minimum: 1
      required:
        - ingredients
        - tags
        - name
        - text
        - cooking_time

    ValidationError:
      description: Standard DRF validation errors
      type: object
      properties:
        field_name:
          description: 'Name of the field containing errors. Multiple fields may contain errors'
          example: [ 'This field is required.' ]
          type: array
          items:
            type: string
    NestedValidationError:
      description: Standard DRF validation errors
      type: object
      properties:
        ingredients:
          description: 'Ingredient errors. In this example, the first and third ingredients have no errors (amount >= 1), while the second does.'
          example: [{},{"amount":["Ensure this value is greater than or equal to 1."]}, {}]
          type: array
          items:
            type: object
            properties:
              amount:
                type: array
                items:
                  type: string

    AuthenticationError:
      description: User is not authenticated
      type: object
      properties:
        detail:
          description: 'Error description'
          example: "Authentication credentials were not provided."
          type: string

    PermissionDenied:
      description: Insufficient permissions
      type: object
      properties:
        detail:
          description: 'Error description'
          example: "You do not have permission to perform this action."
          type: string
    NotFound:
      description: Object not found
      type: object
      properties:
        detail:
          description: 'Error description'
          example: "Page not found."
          type: string

  responses:
    ValidationError:
      description: 'Validation errors in the standard DRF format'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NestedValidationError:
      description: 'Validation errors in the standard DRF format, including errors in nested items.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/NestedValidationError'
              - $ref: '#/components/schemas/ValidationError'

    AuthenticationError:
      description: User is not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'

    PermissionDenied:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionDenied'

    NotFound:
      description: Object not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'

    RecipeNotFound:
      description: 'Recipe not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'

    UserNotFound:
      description: 'User not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'


  securitySchemes:
    Token:
      description: 'Token authentication. <br>
      All requests on behalf of a user must include the "Authorization: Token TOKENVALUE" header'
      type: http
      scheme: token
