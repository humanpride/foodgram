[project]
name = "foodgram"
version = "1.0.0"
description = "A platform for publishing recipes with photos."
readme = "README.md"
authors = [
    { name = "humanpride", email = "sergei.pashkovskii@outlook.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "django>=5.2.17,<5.3",
    "django-filter>=25.2,<26",
    "djangorestframework>=3.17.1,<3.18",
    "djoser>=2.3.3,<2.4",
    "gunicorn>=23.0.0,<24",
    "pillow>=12.1.1,<12.4",
    "psycopg>=3.3.4,<3.4",
    "python-dotenv>=1.2.3,<1.3",
    "weasyprint>=68.1,<71",
]
[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<4.7",
    "ruff>=0.15.13,<0.16",
]

[project.scripts]
backend = "manage:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "-q"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "foodgram.settings"

[tool.ruff]
line-length = 79
target-version = 'py314'
exclude = [
    "tests",
    "*/migrations",
    "data",
    "venv",
    "env",
    "docs",
    "frontend",
    "infra"
]

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "I",    # isort (импорты)
    "N",    # pep8-naming
    "S",    # security (bandit-like)
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
]
ignore = ["S308"]

[tool.ruff.lint.per-file-ignores]
"**/settings.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ['core', 'export', 'foodgram', 'ingredients', 'recipes', 'tags', 'users']
lines-after-imports = 2
